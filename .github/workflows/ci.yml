name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Privacy guard
        run: sudo apt-get install -y libimage-exiftool-perl >/dev/null && npm run privacy:check
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: E2E + accessibility (axe)
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Lighthouse CI (mobile budgets)
        run: npx --yes @lhci/cli@0.15.x autorun
